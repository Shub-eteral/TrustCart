spring.application.name=backend

# Database Configuration (Environment-configurable with fallback defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trustcart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:arijit230}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:abc123}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:TrustCartSecretKeyForJwtAuthentication2026SecureTrustCartSecretKeyForJwtAuthentication2026Secure}

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.authentication=INFO